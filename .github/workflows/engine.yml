name: Ares Cloud Beast Engine

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Wakeup trigger reason'
        required: false
        default: 'cli-wakeup'

permissions:
  contents: write
  actions: write

jobs:
  beast-node:
    name: ⚡ Ares Cloud Media Beast (4 vCPU / 16GB RAM)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout Engine Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: ⚡ Restore Whisper.cpp & AI Model Cache
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: /tmp/whisper-bin
          key: ares-whisper-small-v3-${{ runner.os }}

      - name: 🛠️ Setup High-Performance FFmpeg, yt-dlp & Subtitles
        run: |
          set -e
          echo "=== 1. Checking / Installing FFmpeg Suite ==="
          if ! command -v ffmpeg &> /dev/null || ! command -v ffprobe &> /dev/null; then
            echo "📥 Downloading static high-performance FFmpeg suite from GitHub..."
            curl -fSL --retry 3 --connect-timeout 20 "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o /tmp/ffmpeg.tar.xz
            mkdir -p /tmp/ffmpeg-extracted
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extracted --strip-components=1
            sudo cp /tmp/ffmpeg-extracted/bin/ffmpeg /usr/local/bin/ffmpeg
            sudo cp /tmp/ffmpeg-extracted/bin/ffprobe /usr/local/bin/ffprobe
            sudo chmod a+rx /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-extracted
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          echo "=== 2. Installing Latest yt-dlp ==="
          sudo curl -fSL --retry 3 --connect-timeout 15 "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

          echo "=== 3. Ensuring DejaVu Fonts for ASS Subtitles ==="
          sudo mkdir -p /usr/share/fonts/truetype/dejavu
          if [ ! -f "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf" ]; then
            echo "📥 Downloading DejaVuSans.ttf..."
            sudo curl -fSL --retry 3 --connect-timeout 15 "https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/master/resources/DejaVuSans.ttf" -o /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
            sudo fc-cache -f || true
          fi

      - name: 🧠 Prepare Whisper AI Engine (Cache-Accelerated)
        run: |
          set -e
          mkdir -p /tmp/whisper-bin
          if [ ! -f "/tmp/whisper-bin/whisper-cli" ]; then
            echo "🔨 Compiling whisper.cpp with 4 vCPUs..."
            git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git /tmp/whisper-src
            cd /tmp/whisper-src
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
            cmake --build build --config Release -j 4
            if [ -f "build/bin/whisper-cli" ]; then
              cp build/bin/whisper-cli /tmp/whisper-bin/whisper-cli
            elif [ -f "build/bin/main" ]; then
              cp build/bin/main /tmp/whisper-bin/whisper-cli
            fi
            chmod +x /tmp/whisper-bin/whisper-cli
            rm -rf /tmp/whisper-src
            echo "✅ whisper-cli compiled successfully!"
          else
            echo "✅ Restored whisper-cli from cache!"
            chmod +x /tmp/whisper-bin/whisper-cli
          fi

          if [ ! -f "/tmp/whisper-bin/ggml-small.bin" ]; then
            echo "📥 Downloading Whisper ggml-small.bin model (466 MB)..."
            curl -fSL --retry 3 --connect-timeout 25 -C - "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin" -o /tmp/whisper-bin/ggml-small.bin
            echo "✅ Model downloaded successfully!"
          else
            echo "✅ Restored ggml-small.bin from cache!"
          fi

      - name: 🔥 Launch Ares Cloud Beast Daemon
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAT_TOKEN: ${{ secrets.ARES_PAT || github.token }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WHISPER_CPP_BIN: /tmp/whisper-bin/whisper-cli
          WHISPER_MODEL_PATH: /tmp/whisper-bin/ggml-small.bin
        run: node worker.js
